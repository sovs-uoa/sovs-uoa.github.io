<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOVS Optics Bench - Models</title>
  <meta name="description" content="Schematic eyes and optical instruments to explore in the SOVS Optics Bench.">

  <style>
    :root {
      --bg: #f6f7f9;  --card: #ffffff;  --ink: #1f2933;  --muted: #66727f;  --line: #dfe3e8;
      --accent: #1d6fdc;  --accent-ink: #ffffff;
      --chip: #eef3fb;  --chip-ink: #1b4b8f;  --chip-hover: #dbe8fb;  --chip-line: #c7d7f0;
      --image-bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171b;  --card: #1d2228;  --ink: #e8ecf0;  --muted: #98a4b0;  --line: #2c333b;
        --accent: #5b9dff;  --accent-ink: #0d1116;
        --chip: #25324a;  --chip-ink: #bcd4ff;  --chip-hover: #2f4066;  --chip-line: #3a4c70;
        --image-bg: #ffffff;       /* the pictures are drawn on white */
      }
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    header { padding: 48px 20px 12px; text-align: center; }
    header h1 { margin: 0 0 6px; font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: -0.01em; }
    header p  { margin: 2px 0; color: var(--muted); }
    header a  { color: var(--accent); }

    section { max-width: 1100px; margin: 0 auto; padding: 22px 16px 8px; }
    section h2 { margin: 0 0 4px; font-size: 1.3rem; }
    section .about { margin: 0 0 14px; color: var(--muted); font-size: .95rem; }

    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

    .model { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
             display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .model img { display: block; width: 100%; aspect-ratio: 2 / 1; object-fit: cover; background: var(--image-bg);
                 border-bottom: 1px solid var(--line); }
    .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .model h3 { margin: 0; font-size: 1.05rem; }
    .model p  { margin: 0; color: var(--muted); font-size: .9rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .78rem; line-height: 1.4;
            color: var(--chip-ink); background: var(--chip); border: 1px solid var(--chip-line); text-decoration: none; }
    .chip:hover, .chip:focus-visible { background: var(--chip-hover); outline: none; }

    .open { margin-top: auto; align-self: flex-start; padding: 8px 16px; border-radius: 8px; text-decoration: none;
            background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .9rem; }
    .open:hover { filter: brightness(1.08); }

    footer { text-align: center; color: var(--muted); font-size: .82rem; padding: 28px 16px 40px; }
    footer a { color: inherit; }
  </style>
</head>

<body>

  <header>
    <h1>Models</h1>
    <p>Pick a model to open it on the optics bench.</p>
    <p><a href="main.html">Search all the models</a> &middot; <a href="index.html">&larr; the laboratories</a></p>
  </header>

  <div id="sections"></div>

  <footer>
    SOVS Optics Bench &middot; <a href="index.html">laboratories</a> &middot; <a href="index.classic.html">classic index</a>
  </footer>

  <script>
  /*
     Each card opens one model (page?model=ID - see js/main.js); the small chips under it are variants of the same
     model. Titles of the variants come from config/config.json, so renaming a model there renames its chip here.
     The pictures are in images/models/ - one per card.
  */
  var SECTIONS = [
    { title: "Schematic eyes",
      about: "Models of the whole eye, from the single reduced surface to the full multi-surface schematic eyes.",
      models: [
        { title: "Reduced eye", page: "eye.html", id: "58", image: "images/models/reduced-eye.png",
          blurb: "One refracting surface and a retina: the simplest eye that still forms an image.",
          variants: [ "55", "12", "17" ] },
        { title: "Le Grand schematic eye", page: "eye.html", id: "10", image: "images/models/legrand-eye.png",
          blurb: "The Le Grand relaxed eye: cornea, aqueous, lens and vitreous.",
          variants: [ "11" ] },
        { title: "Gullstrand schematic eye", page: "eye.html", id: "59", image: "images/models/gullstrand-eye.png",
          blurb: "Gullstrand's number 1 eye, relaxed and accommodated, with its lens on its own.",
          variants: [ "60", "61" ] }
      ] },
    { title: "Instruments",
      about: "Afocal systems: the magnification comes from the angle, not an image distance.",
      models: [
        { title: "Keplerian telescope", page: "Laboratory6.html", id: "6", image: "images/models/keplerian-telescope.png",
          blurb: "Two positive lenses: an inverted image, with the stop at the intermediate image if you want one.",
          variants: [ "78" ] },
        { title: "Galilean telescope", page: "Laboratory6.html", id: "7", image: "images/models/galilean-telescope.png",
          blurb: "A positive objective and a negative eyepiece: an upright image, and a shorter instrument.",
          variants: [ "16" ] }
      ] }
  ];

  function el (tag, className, text) {
    var e = document.createElement(tag);
    if (className) { e.className = className; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }

  function build (titles) {

    var root = document.getElementById("sections");

    SECTIONS.forEach(function (section) {

      var s = el("section");
      s.appendChild(el("h2", "", section.title));
      s.appendChild(el("p", "about", section.about));

      var grid = el("div", "grid");
      section.models.forEach(function (m) {

        var link = m.page + "?model=" + encodeURIComponent(m.id);

        var card = el("article", "model");

        var pictureLink = el("a"); pictureLink.href = link;
        var img = el("img"); img.src = m.image; img.alt = m.title + " drawn on the optics bench"; img.loading = "lazy";
        pictureLink.appendChild(img);
        card.appendChild(pictureLink);

        var body = el("div", "body");
        body.appendChild(el("h3", "", m.title));
        body.appendChild(el("p", "", m.blurb));

        var chips = el("div", "chips");
        m.variants.forEach(function (id) {
          if (!titles[id]) { return; }
          var chip = el("a", "chip", titles[id]);
          chip.href = m.page + "?model=" + encodeURIComponent(id);
          chips.appendChild(chip);
        });
        if (chips.children.length) { body.appendChild(chips); }

        var open = el("a", "open", "Open model");
        open.href = link;
        body.appendChild(open);

        card.appendChild(body);
        grid.appendChild(card);
      });

      s.appendChild(grid);
      root.appendChild(s);
    });
  }

  fetch("config/config.json", { cache: "no-cache" })
    .then(function (r) { return r.json(); })
    .then(function (config) {
      var titles = {};
      config.models.forEach(function (m) { titles[m.id] = m.title; });
      build(titles);
    })
    .catch(function () { build({}); });      // the cards still work without the variant chips
  </script>

</body>
</html>
