<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1f2933; --muted:#66727f; --line:#dfe3e8; --accent:#1d6fdc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1d2228; --ink:#e8ecf0; --muted:#98a4b0; --line:#2c333b; --accent:#5b9dff; } }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { max-width: 860px; margin: 0 auto; padding: 24px 20px 70px; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; hyphens: manual; }
  h1 { font-size: clamp(1.7rem, 4vw, 2.2rem); margin: .4em 0 .4em; }
  .back { display:inline-block; color: var(--accent); text-decoration:none; }
  h2 { margin-top: 2.2em; padding-top: .4em; border-top: 1px solid var(--line); }
  h3 { margin-top: 1.6em; }
  a { color: var(--accent); }
  code { background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: .92em; }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  pre code { border: 0; padding: 0; background: none; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; background: var(--card); }
  th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: color-mix(in srgb, var(--line) 40%, var(--card)); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2.5em 0 1em; }
  #TOC, nav#TOC { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 18px; margin: 20px auto; }
  img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; display: block; margin: 1.2em auto .4em; }
  p > em:only-child { display: block; color: var(--muted); font-size: .92em; text-align: center; margin-bottom: 1.4em; }
</style>
